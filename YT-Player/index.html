<style type="text/css">
/* Modifikasi background body agar transparan & menumpuk di atas bintang */
body {
    background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
    color: #ffffff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    overflow: hidden; /* Mengunci layar agar tidak bisa di-scroll keluar */
}

/* Pastikan kotak pemutar musik mengambang cantik di atas bintang */
.music-container {
    background: rgba(30, 30, 30, 0.85); /* Dibuat sedikit transparan */
    backdrop-filter: blur(10px); /* Efek kaca buram modern */
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    width: 360px;
    text-align: center;
    z-index: 10;
}

/* =======================================================
   SISTEM ANIMASI PARALLAX BINTANG (BACKGROUND)
   ======================================================= */
#stars-layer-1, #stars-layer-2, #stars-layer-3 {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none; /* Klik tikus tembus ke tombol */
}

/* Lapisan 1: Bintang Kecil (Bergerak Lambat) */
#stars-layer-1 {
    animation: spaceMove 150s linear infinite;
}

/* Lapisan 2: Bintang Sedang (Bergerak Sedang) */
#stars-layer-2 {
    animation: spaceMove 100s linear infinite;
}

/* Lapisan 3: Bintang Besar & Terang (Bergerak Cepat) */
#stars-layer-3 {
    animation: spaceMove 50s linear infinite;
}

/* Frame pergerakan bintang mengalir dari atas ke bawah */
@keyframes spaceMove {
    from {
        transform: translateY(0px);
    }
    to {
        transform: translateY(-2000px); /* Bergeser sejauh tinggi repetisi */
    }
}

<div class="music-container">

        <!-- Daftar Lagu / Hasil Pencarian -->
        <div class="playlist-section">
            <h4>Daftar Putar / Hasil Cari</h4>
            <div id="playlist-container" class="playlist">

    <!-- Memuat Library Iframe API resmi dari YouTube -->
    <script src="https://youtube.com"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {

    <script type="text/javascript">// Memasukkan API Key YouTube Data API v3 milik Anda
    const API_KEY = "AIzaSyBxBsXHbC2hu6qRO6NBOcZTvLcoxxChWvA";
    
    let ytPlayer;
    let playlist = [];
    let currentTrackIndex = 0;
    let progressInterval;
    let animationId;
    
    // DOM Elemen
    const btnPlay = document.getElementById('btn-play');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const trackTitle = document.getElementById('track-title');
    const timeDisplay = document.getElementById('time-display');
    const progressBar = document.getElementById('progress-bar');
    const playlistContainer = document.getElementById('playlist-container');
    const searchInput = document.getElementById('search-input');
    const btnSearch = document.getElementById('btn-search');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');
    
    // 1. Inisialisasi Player YouTube secara otomatis dari API script Google
    window.onYouTubeIframeAPIReady = function() {
    ytPlayer = new YT.Player('yt-player-hidden', {
    height: '0',
    width: '0',
    videoId: '', 
    events: {
    'onStateChange': onPlayerStateChange
    }
    });
    };
    
    // 2. Fungsi Tombol Cari Musik menggunakan API YouTube
    async function searchMusic(query) {
    if (!query) return;
    playlistContainer.innerHTML = "<p style='color:#888; padding:10px;'>Mencari lagu...</p>";
    
    const url = `https://googleapis.com{encodeURIComponent(query)}&type=video&key=${API_KEY}`;
    
    try {
    const response = await fetch(url);
    const data = await response.json();
    
    if (data.items && data.items.length > 0) {
    playlist = data.items.map(item => ({
    title: item.snippet.title,
    id: item.id.videoId
    }));
    
    // Simpan riwayat pencarian terakhir ke memori lokal untuk akses Offline
    localStorage.setItem('yt_offline_playlist', JSON.stringify(playlist));
    renderPlaylist();
    playTrack(0);
    } else {
    playlistContainer.innerHTML = "<p style='color:#ff5555; padding:10px;'>Lagu tidak ditemukan.</p>";
    }
    } catch (error) {
    console.error("Gagal memuat data API YouTube:", error);
    playlistContainer.innerHTML = "<p style='color:#ff5555; padding:10px;'>Koneksi gagal / Limit API habis.</p>";
    }
    }
    
    // Jalankan pencarian saat tombol diklik atau menekan Enter
    btnSearch.addEventListener('click', () => searchMusic(searchInput.value));
    searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') searchMusic(searchInput.value); });
    
    // 3. Logika Mengganti Lagu
    function playTrack(index) {
    if (playlist.length === 0) return;
    currentTrackIndex = index;
    const track = playlist[index];
    
    trackTitle.innerHTML = track.title;
    ytPlayer.loadVideoById(track.id);
    btnPlay.innerText = "⏸ Pause";
    
    // Tandai lagu aktif di tampilan playlist
    document.querySelectorAll('.playlist-item').forEach((el, idx) => {
    if(idx === index) el.classList.add('active');
    else el.classList.remove('active');
    });
    }
    
    // 4. Memantau Status Player (Sedang berputar, Berhenti, Selesai)
    function onPlayerStateChange(event) {
    if (event.data === YT.PlayerState.PLAYING) {
    btnPlay.innerText = "⏸ Pause";
    startTimelineUpdate();
    startVisualizerAnimation(); // Mulai animasi gerak saat lagu berbunyi
    } else {
    btnPlay.innerText = "▶ Play";
    clearInterval(progressInterval);
    cancelAnimationFrame(animationId); // Hentikan animasi saat dipause
    }
    
    // Otomatis putar lagu berikutnya jika lagu saat ini habis
    if (event.data === YT.PlayerState.ENDED) {
    btnNext.click();
    }
    }
    
    // 5. Update Menggeser Pengukur Waktu (Timeline)
    function startTimelineUpdate() {
    clearInterval(progressInterval);
    progressInterval = setInterval(() => {
    if (ytPlayer && ytPlayer.getCurrentTime) {
    const currentTime = ytPlayer.getCurrentTime();
    const duration = ytPlayer.getDuration();
    
    if (duration > 0) {
    progressBar.value = (currentTime / duration) * 100;
    timeDisplay.innerText = `${formatTime(currentTime)} / ${formatTime(duration)}`;
    }
    }
    }, 1000);
    }
    
    progressBar.addEventListener('input', () => {
    if (ytPlayer && ytPlayer.getDuration) {
    const newTime = (progressBar.value / 100) * ytPlayer.getDuration();
    ytPlayer.seekTo(newTime, true);
    }
    });
    
    function formatTime(seconds) {
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${min}:${sec}`;
    }
    
    // 6. Kontrol Navigasi
    btnPlay.addEventListener('click', () => {
    if (!ytPlayer) return;
    const state = ytPlayer.getPlayerState();
    if (state === YT.PlayerState.PLAYING) {
    ytPlayer.pauseVideo();
    } else {
    ytPlayer.playVideo();
    }
    });
    
    btnNext.addEventListener('click', () => {
    if (playlist.length === 0) return;
    let nextIdx = (currentTrackIndex + 1) % playlist.length;
    playTrack(nextIdx);
    });
    
    btnPrev.addEventListener('click', () => {
    if (playlist.length === 0) return;
    let prevIdx = (currentTrackIndex - 1 + playlist.length) % playlist.length;
    playTrack(prevIdx);
    });
    
    // 7. Render Tampilan List Item
    function renderPlaylist() {
    playlistContainer.innerHTML = '';
    playlist.forEach((track, index) => {
    const item = document.createElement('div');
    item.classList.add('playlist-item');
    item.innerText = `${index + 1}. ${track.title.replace(/&quot;/g, '"')}`;
    item.addEventListener('click', () => playTrack(index));
    playlistContainer.appendChild(item);
    });
    }
    
    // 8. ANIMASI AUDIO VISUALIZER (Efek Gelombang Bergerak)
    // Karena Iframe YouTube membatasi pembacaan frekuensi langsung demi keamanan cross-origin,
    // Kita mengimplementasikan simulasi ketukan (Beat Waveform) matematis yang bergerak sinkron mengikuti waktu berputarnya lagu.
    function startVisualizerAnimation() {
    const barsCount = 30;
    const barWidth = (canvas.width = canvas.clientWidth) / barsCount;
    const height = canvas.height = canvas.clientHeight;
    
    function renderFrame() {
    animationId = requestAnimationFrame(renderFrame);
    canvasCtx.clearRect(0, 0, canvas.width, height);
    canvasCtx.fillStyle = '#151515';
    canvasCtx.fillRect(0, 0, canvas.width, height);
    
    let x = 0;
    for (let i = 0; i < barsCount; i++) {
    // Formula matematika sinus/kosinus menghasilkan lompatan dinamis menyerupai ketukan audio asli
    const timeFactor = Date.now() * 0.005;
    const wave = Math.sin(i * 0.3 + timeFactor) * Math.cos(i * 0.1 + timeFactor);
    const barHeight = Math.abs(wave) * (height * 0.8) + 5;
    
    // Gradasi Warna hijau neon Rumusmusic
    canvasCtx.fillStyle = `rgb(29, ${150 + barHeight * 2}, 84)`;
    canvasCtx.fillRect(x, height - barHeight, barWidth - 3, barHeight);
    x += barWidth;
    }
    }
    renderFrame();
    }
    
    // Inisialisasi awal mengambil data riwayat jika user offline
    const offlineCache = localStorage.getItem('yt_offline_playlist');
    if (offlineCache) {
    playlist = JSON.parse(offlineCache);
    renderPlaylist();
    }
    // =======================================================
    // FUNGSI GENERATOR KOORDINAT BINTANG PARALLAX
    // =======================================================
    function generateStars(elementId, count, starSize, starColor) {
    const container = document.getElementById(elementId);
    if (!container) return;
    
    let boxShadowString = "";
    const screenWidth = window.innerWidth;
    const screenHeight = 2000; // Tinggi area jangkauan bintang agar repetisi halus
    
    for (let i = 0; i < count; i++) {
    const randomX = Math.floor(Math.random() * screenWidth);
    const randomY = Math.floor(Math.random() * screenHeight);
    
    boxShadowString += `${randomX}px ${randomY}px ${starColor}`;
    if (i < count - 1) {
    boxShadowString += ", ";
    }
    }
    
    // Suntikkan gaya bintang ke elemen HTML khusus
    container.style.width = `${starSize}px`;
    container.style.height = `${starSize}px`;
    container.style.background = "transparent";
    container.style.boxShadow = boxShadowString;
    }
    
    // Menjalankan pembuatan bintang saat halaman pertama kali dimuat
    window.addEventListener('DOMContentLoaded', () => {
    // Parameter: (ID Elemen, Jumlah Bintang, Ukuran Pixel, Warna)
    generateStars("stars-layer-1", 250, 1, "#ffffff");   // 250 Bintang Kecil
    generateStars("stars-layer-2", 100, 2, "#e0e0e0");   // 100 Bintang Sedang
    generateStars("stars-layer-3", 40, 3, "#1DB954");    // 40 Bintang Besar Hijau Neon senada tema
    });
    
    // Otomatis kalkulasi ulang susunan bintang jika ukuran layar browser diubah (Resize)
    window.addEventListener('resize', () => {
    generateStars("stars-layer-1", 250, 1, "#ffffff");
    generateStars("stars-layer-2", 100, 2, "#e0e0e0");
    generateStars("stars-layer-3", 40, 3, "#1DB954");
    });
    
    </script>
    <script type="text/javascript">
    const CACHE_NAME = 'rumusmusic-yt-v1';
    const OFFLINE_ASSETS = [
    './',
    './index.html',
    './style.css',
    './app.js',
    './manifest.json'
    ];
    
    self.addEventListener('install', e => {
    e.waitUntil(
    caches.open(CACHE_NAME).then(cache => cache.addAll(OFFLINE_ASSETS))
    );
    });
    
    self.addEventListener('fetch', e => {
    e.respondWith(
    caches.match(e.request).then(cached => cached || fetch(e.request))
    );
    });
    
    </script>
