<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rumusmusic YT Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4257586289753883"
     crossorigin="anonymous"></script>
  <meta name="google-adsense-account" content="ca-pub-4257586289753883">
<meta name="theme-color" content="#0B0F1A"/>
<meta name="description" content="RumusMusic - Cari musik, trending video, dan playlist favorit dengan cepat"/>

<!-- Google Verification -->
<meta name="google-site-verification" content="c5Cc9r8Eyp-IXdjJjJEtiGejzN98C7KM5g8ONi9ddSk" />

<!-- Adsense -->
<meta name="google-adsense-account" content="ca-pub-4848025323084395"/>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4848025323084395" crossorigin="anonymous"></script>

</head>
<body>

    <div class="music-container">
        <h2>Rumusmusic Mp3 Player</h2>
        
        <!-- Kolom Cari Musik YouTube -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Cari lagu di YouTube...">
            <button id="btn-search">🔍</button>
        </div>

        <!-- Animasi Equalizer / Visualizer -->
        <div class="visualizer-container">
            <canvas id="visualizer"></canvas>
        </div>

        <!-- Info Lagu Aktif -->
        <div class="track-info">
            <h3 id="track-title">No song Selected..</h3>
            <span id="time-display">0:00 / 0:00</span>
        </div>

        <!-- Pemutar YouTube Asli (Disembunyikan via CSS) -->
        <div id="yt-player-hidden"></div>

        <!-- Kontrol Utama -->
        <div class="controls">
            <button id="btn-prev">⏮</button>
            <button id="btn-play">▶ Play</button>
            <button id="btn-next">⏭</button>
        </div>

        <!-- Progress Bar / Timeline -->
        <div class="progress-container">
            <input type="range" id="progress-bar" value="0" min="0" max="100">
        </div>

        <!-- Daftar Lagu / Hasil Pencarian -->
        <div class="playlist-section">
            <h4>Daftar Putar / Hasil Cari</h4>
            <div id="playlist-container" class="playlist">
                <p style="color: #666; text-align: center; font-size: 13px;">Gunakan kolom cari untuk mengisi daftar...</p>
            </div>
        </div>
    </div>
<!-- Masukkan kode ini tepat di bawah tag <body> -->
<div id="stars-layer-1"></div>
<div id="stars-layer-2"></div>
<div id="stars-layer-3"></div>

<div class="music-container">
    <!-- Konten Pemutar Musik Anda Yang Sebelumnya Tetap Di Sini -->

    <!-- Memuat Library Iframe API resmi dari YouTube -->
    <script src="https://youtube.com"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
